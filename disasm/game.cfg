MEMORY {
    HDR:    start=$0000, size=$0010, type=ro, file=%O, fill=yes;
    PRG_0:  start=$8000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
    PRG_1:  start=$8000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
    PRG_2:  start=$8000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
    PRG_3:  start=$C000, size=$4000, type=ro, file=%O, fill=yes, fillval=$00;
}

SEGMENTS {
    HEADER:  load=HDR,   type=ro;
    BANK_0:  load=PRG_0, type=ro;
    BANK_1:  load=PRG_1, type=ro;
    BANK_2:  load=PRG_2, type=ro;
    BANK_3:  load=PRG_3, type=ro;
}
